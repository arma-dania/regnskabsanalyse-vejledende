[build]
  # Prøverne kører før hvert deploy og stopper det, hvis analysen ikke
  # længere går op mod nøgletallene.
  command = "npm run proeve && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
